<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | {{{ PRODUCT_NAME }}}</title>
    <meta name="description" content="{{{ DESCRIPTION }}}">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      body{margin:0;background:#142026;color:#f1f5f2;font:14px system-ui,sans-serif}
      #unity-container{position:fixed;inset:0;width:100%;height:100%;transform:none}
      #unity-canvas-container{position:absolute;inset:0 0 76px;width:100%!important;height:calc(100% - 76px)!important}
      #unity-footer{position:absolute;bottom:0;left:0;right:0;height:76px;padding:10px 16px;box-sizing:border-box;background:#142026;display:flex;gap:14px;align-items:center;justify-content:center}
      #unity-footer #enterar{display:inline-block;float:none;width:auto;height:auto;background:#8bdeb7;color:#12382b;border:0;border-radius:7px;padding:10px 16px;min-height:44px;font:600 14px system-ui,sans-serif;cursor:pointer;white-space:nowrap}
      #unity-footer #enterar:disabled{opacity:.45;cursor:default}
      #practice-status{max-width:440px;margin:0;font:12px/1.4 system-ui,sans-serif;color:#c5d0cc}
      #unity-loading-bar{z-index:2}#unity-logo{display:none}
      @media(max-width:600px){#unity-footer{height:104px;padding-bottom:max(10px,env(safe-area-inset-bottom));gap:8px;flex-direction:column;text-align:center}#unity-canvas-container{height:calc(100% - 104px)!important;bottom:104px}}
    </style>
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-canvas-container">
        <canvas id="unity-canvas" style="width: 100%; height: 100%;"></canvas>
      </div>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-footer">
        <button id="enterar" value="Enter AR" disabled>Начать AR</button>
        <p id="practice-status" role="status">Загрузка сцены…</p>
      </div>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var canvasContainer = document.querySelector("#unity-canvas-container");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var unityInstance = null;
      {{{ WEBXR_POLYFILL_CONFIG }}}

      canvasContainer.style.width = "{{{ WIDTH }}}px";
      canvasContainer.style.height = "{{{ HEIGHT }}}px";
#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
          document.getElementById('practice-status').textContent = 'Загрузка сцены… ' + Math.round(progress * 100) + '%';
        }).then((instance) => {
          unityInstance = instance;
          loadingBar.style.display = "none";
          updatePracticeStatus();
        }).catch((message) => {
          loadingBar.style.display = 'none';
          document.getElementById('practice-status').textContent = 'Ошибка загрузки: ' + message;
        });
      };
      document.body.appendChild(script);

      let enterARButton = document.getElementById('enterar');
      let arSupported = false;
      function updatePracticeStatus() {
        enterARButton.disabled = !arSupported || !unityInstance;
        if (unityInstance) document.getElementById('practice-status').textContent = arSupported
          ? 'Нажмите «Начать AR». Куб будет перед камерой.'
          : 'AR недоступна. Доступен 3D-просмотр.';
      }

      document.addEventListener('onARSupportedCheck', function (event) {
        arSupported = event.detail.supported;
        updatePracticeStatus();
      }, false);
      enterARButton.addEventListener('click', function (event) {
        unityInstance.Module.WebXR.toggleAR();
      }, false);
    </script>
  </body>
</html>
