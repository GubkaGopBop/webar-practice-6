<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | {{{ PRODUCT_NAME }}}</title>
    <meta name="description" content="{{{ DESCRIPTION }}}">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      body{margin:0;background:#142026;color:#f1f5f2;font-family:system-ui,sans-serif}
      #unity-container{position:fixed;inset:0;width:100%;height:100%;transform:none;}
      #unity-canvas-container{position:absolute;inset:0 0 100px;width:100%!important;height:calc(100% - 100px)!important;}
      #unity-footer{position:absolute;bottom:0;left:0;right:0;height:100px;padding:10px 16px;box-sizing:border-box;background:#1e302c;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:13px;line-height:1.4;}
      #unity-webgl-logo,#unity-build-title,#unity-webxr-link{display:none}
      #unity-footer #entervr{display:none}#unity-footer #enterar{display:inline-block;float:none;width:auto;height:auto;background:#8bdeb7;color:#12382b;border:0;border-radius:10px;padding:12px 20px;min-height:44px;font-weight:600;font-size:15px;cursor:pointer}#unity-footer #enterar:disabled{opacity:.45;cursor:default}
      #practice-status{max-width:520px;margin:0}#unity-loading-bar{z-index:2}#unity-logo{display:none}
      @media(max-width:600px){#unity-footer{height:128px;padding-bottom:max(10px,env(safe-area-inset-bottom));gap:6px;font-size:12px}#unity-canvas-container{height:calc(100% - 128px)!important;bottom:128px}#unity-footer #enterar{padding:10px 18px}}
    </style>
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-canvas-container">
        <canvas id="unity-canvas" style="width: 100%; height: 100%;"></canvas>
      </div>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <button id="entervr" value="Enter VR" disabled>VR</button>
        <button id="enterar" value="Enter AR" disabled>Начать AR</button>
        <p id="practice-status" role="status">Загружаем сцену. Куб появится в центре экрана.</p>
        <div id="unity-webxr-link">Using <a href="https://github.com/De-Panther/unity-webxr-export" target="_blank" title="WebXR Export">WebXR Export</a></div>
        <div id="unity-build-title">{{{ PRODUCT_NAME }}}</div>
      </div>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var canvasContainer = document.querySelector("#unity-canvas-container");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var unityInstance = null;
      {{{ WEBXR_POLYFILL_CONFIG }}}

      canvasContainer.style.width = "{{{ WIDTH }}}px";
      canvasContainer.style.height = "{{{ HEIGHT }}}px";
#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((instance) => {
          unityInstance = instance;
          loadingBar.style.display = "none";
          updatePracticeStatus();
          if (fullscreenButton)
          {
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
        }).catch((message) => {
          document.getElementById('practice-status').textContent = 'Ошибка загрузки: ' + message;
        });
      };
      document.body.appendChild(script);

      let enterARButton = document.getElementById('enterar');
      let enterVRButton = document.getElementById('entervr');
      let arSupported = false;
      function updatePracticeStatus() {
        enterARButton.disabled = !arSupported || !unityInstance;
        if (unityInstance) document.getElementById('practice-status').textContent = arSupported
          ? 'Куб следует за направлением взгляда. Нажмите «Начать AR», чтобы увидеть его через камеру.'
          : '3D-сцена работает. WebXR AR недоступна в этом браузере или на устройстве.';
      }

      document.addEventListener('onARSupportedCheck', function (event) {
        arSupported = event.detail.supported;
        updatePracticeStatus();
      }, false);
      document.addEventListener('onVRSupportedCheck', function (event) {
        enterVRButton.disabled = !event.detail.supported;
      }, false);

      enterARButton.addEventListener('click', function (event) {
        unityInstance.Module.WebXR.toggleAR();
      }, false);
      enterVRButton.addEventListener('click', function (event) {
        unityInstance.Module.WebXR.toggleVR();
      }, false);
    </script>
  </body>
</html>
